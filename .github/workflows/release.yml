name: Create npm and GitHub Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # For publishing to npm using --provenance

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: get_version
        uses: ./.github/actions/get-version
        with:
          working-directory: ./packages/auth0-nuxt

  rl-scan:
    needs: version
    permissions:
      contents: read
      id-token: write # For AWS OIDC federation in the RL scan
    uses: ./.github/workflows/rl.yml
    with:
      artifact-name: auth0-nuxt
      artifact-path: auth0-nuxt.tgz
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    needs: [version, rl-scan]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    environment: release
    strategy:
      matrix:
        package: [auth0-nuxt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Publish the tarball that passed the RL scan rather than rebuilding it
      - name: Download scanned tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auth0-nuxt
          path: ${{ runner.temp }}/scanned

      - id: release
        uses: ./.github/actions/release
        with:
          package: ${{ matrix.package }}
          node-version: 24
          require-build: true
          release-directory: ./
          tarball: ${{ runner.temp }}/scanned/auth0-nuxt.tgz
          github-token: ${{ secrets.GITHUB_TOKEN }}
